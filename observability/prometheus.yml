global:
  scrape_interval: 5s
  scrape_timeout: 2s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:9464']
  - job_name: scheduler
    static_configs:
      - targets: ['scheduler:9464']
  - job_name: publisher
    static_configs:
      - targets: ['publisher:9464']
  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9464
        refresh_interval: 5s
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
      vhost: ['/']
      queue: ['^flowforge\.(tasks|dead)\.v1$']
    static_configs:
      - targets: ['rabbitmq:15692']
