[project]
name = "flowforge"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2,<3",
    "asyncpg",
    "alembic",
    "aio-pika",
    "pydantic>=2,<3",
    "pwdlib[argon2]>=0.4.2",
    "pyjwt>=2.15.1",
    "email-validator>=2.4.0",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "prometheus-client==0.26.0",
]
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "pytest-cov>=7.1.0",
    "pip-audit>=2.10.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "BLE"]
[tool.ruff.lint.isort]
known-first-party = ["flowforge"]
[tool.mypy]
strict = true
packages = ["flowforge"]

plugins = ["pydantic.mypy"]

[tool.coverage.run]
concurrency = ["thread", "greenlet"]
