stages: [check, smoke]
backend:
  stage: check
  image: ghcr.io/astral-sh/uv:0.11.0-python3.12-trixie-slim
  script:
    - cd backend
    - uv sync --frozen
    - uv run ruff check . ../scripts/verify_stack.py ../scripts/benchmark.py
    - uv run mypy
    - uv run pytest --junitxml=../reports/junit.xml --cov=flowforge.contracts --cov-report=xml:../reports/coverage.xml --cov-fail-under=80
    - uv export --quiet --frozen --no-emit-project --format requirements-txt --output-file ../reports/requirements-audit.txt
    - uv run pip-audit -r ../reports/requirements-audit.txt --no-deps --disable-pip
  artifacts:
    when: always
    reports:
      junit: reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml
frontend:
  stage: check
  image: node:24.11.0-alpine
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm run typecheck
    - npm run build
    - npm audit --audit-level=high
smoke:
  stage: smoke
  needs:
    - job: backend
      artifacts: false
  image: docker:29.0.0-cli
  services: [docker:29.0.0-dind]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    COMPOSE_PROJECT_NAME: ff-ci-$CI_PIPELINE_ID
  script:
    - cp .env.example .env
    - printf '\nFLOWFORGE_JWT_SECRET=%s\n' "$(head -c 48 /dev/urandom | base64 | tr -d '\n')" >> .env
    - export FLOWFORGE_GRAFANA_ADMIN_PASSWORD="$(head -c 32 /dev/urandom | base64 | tr -d '\n')"
    - printf '\nFLOWFORGE_GRAFANA_ADMIN_PASSWORD=%s\n' "$FLOWFORGE_GRAFANA_ADMIN_PASSWORD" >> .env
    - docker compose build api
    - docker compose build frontend
    - docker compose --profile smoke build dashboard-smoke
    - |
      for service in postgres rabbitmq; do
        for attempt in 1 2 3; do
          if docker compose pull "$service"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          sleep "$((attempt * 5))"
        done
      done
    - docker compose up -d --no-build --pull never --wait
    - docker compose exec -T api python -m flowforge.process worker --probe
    - docker compose exec -T api python -m flowforge.process scheduler --probe
    - mkdir -p reports
    - docker compose stop scheduler publisher worker frontend
    - docker compose exec -T api pytest tests integration -q --junitxml=/tmp/integration.xml --cov=flowforge --cov-report=json:/tmp/coverage.json
    - docker compose exec -T api python -m flowforge.coverage_gate /tmp/coverage.json
    - docker compose exec -T api python integration/http_acceptance.py
    - docker compose up -d --no-build --wait scheduler publisher frontend
    - docker compose stop rabbitmq
    - docker compose exec -T api python integration/dispatch_acceptance.py outage
    - docker compose up -d --wait rabbitmq
    - docker compose exec -T api python integration/dispatch_acceptance.py recovery
    - docker compose stop publisher
    - docker compose exec -T api python integration/dispatch_acceptance.py backlog
    - docker compose stop api scheduler frontend
    - docker compose run --rm --no-deps api python integration/migration_acceptance.py worker
    - docker compose up -d --no-build --wait
    - docker compose exec -T api python integration/dispatch_acceptance.py execution
    - |
      set -o pipefail
      dashboard() {
        docker compose exec -T api python integration/dashboard_accounts.py |
          docker compose run --rm --no-deps -T dashboard-smoke "$1" |
          tee -a reports/dashboard-smoke.log
      }
      dashboard full
      docker compose stop scheduler publisher worker
      dashboard cancel
    - docker compose cp api:/tmp/integration.xml reports/integration.xml
    - docker compose cp api:/tmp/coverage.json reports/coverage.json
    - docker compose stop api scheduler publisher worker frontend
    - docker compose run --rm api python integration/migration_acceptance.py
    - docker compose run --rm migrate alembic downgrade base
    - docker compose run --rm migrate alembic upgrade head
    - docker compose up -d --no-build --wait
    - docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
    - |
      set -o pipefail
      telemetry() {
        docker compose -f compose.yaml -f compose.observability.yaml --profile observability "$@"
      }
      phase() {
        telemetry exec -T -e FLOWFORGE_GRAFANA_ADMIN_PASSWORD api \
          python integration/telemetry_acceptance.py "$1" | tee -a reports/telemetry-smoke.log
      }
      docker compose stop publisher worker
      telemetry up -d --no-build --wait api scheduler rabbitmq prometheus jaeger grafana
      phase queued
      telemetry up -d --no-build --wait publisher
      phase broker
      telemetry up -d --no-build --wait --scale worker=2 worker
      phase completed
      telemetry stop prometheus jaeger
      phase offline
      telemetry up -d --no-build --wait prometheus jaeger
      phase restored
      telemetry logs --no-color api scheduler publisher worker > reports/telemetry-roles.log
      grep -F '"event": "run.created"' reports/telemetry-roles.log > /dev/null
      grep -F '"trace_id":' reports/telemetry-roles.log > /dev/null
      if grep -qF 'flowforge-observability-smoke-private-input' reports/telemetry-roles.log; then exit 1; fi
  after_script:
    - mkdir -p reports
    - docker compose cp api:/tmp/integration.xml reports/integration.xml || true
    - docker compose cp api:/tmp/coverage.json reports/coverage.json || true
    - docker compose -f compose.yaml -f compose.observability.yaml --profile observability ps -a > compose-status.log
    - |
      containers=$(docker compose -f compose.yaml -f compose.observability.yaml --profile observability ps -aq)
      if [ -n "$containers" ]; then
        docker inspect --format '{{json .State}}' $containers > container-diagnostics.json
      fi
    - docker compose -f compose.yaml -f compose.observability.yaml --profile observability logs --no-color > compose.log
    - docker compose -f compose.yaml -f compose.observability.yaml --profile observability down -v --remove-orphans
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - compose.log
      - compose-status.log
      - container-diagnostics.json
      - reports/integration.xml
      - reports/coverage.json
      - reports/dashboard-smoke.log
      - reports/telemetry-smoke.log
    reports:
      junit: reports/integration.xml
diagrams:
  stage: check
  image: node:24.11.0-bookworm
  script:
    - cd tooling
    - npm ci
    - apt-get update
    - npx puppeteer browsers install chrome --install-deps
    - npm run diagrams
    - npm audit --audit-level=high
  artifacts:
    expire_in: 7 days
    paths: [reports/]
