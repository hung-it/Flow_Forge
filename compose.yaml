x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:-flowforge}-backend:local
  build: ./backend
  environment:
    FLOWFORGE_DATABASE_URL: ${FLOWFORGE_DATABASE_URL:?copy .env.example to .env}
    FLOWFORGE_RABBITMQ_URL: ${FLOWFORGE_RABBITMQ_URL:?copy .env.example to .env}
  init: true
  mem_limit: 512m
  pids_limit: 128
  stop_grace_period: 20s
  depends_on:
    migrate:
      condition: service_completed_successfully
services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 3s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.2.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *backend
    ports: ['127.0.0.1:${API_PORT:-8000}:8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
  scheduler:
    <<: *backend
    command: [python, -m, flowforge.process, scheduler]
    healthcheck:
      test: [CMD, python, -m, flowforge.process, scheduler, --health]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s
  publisher:
    <<: *backend
    command: [python, -m, flowforge.process, publisher]
    healthcheck:
      test: [CMD, python, -m, flowforge.process, publisher, --health]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
  worker:
    <<: *backend
    command: [python, -m, flowforge.process, worker]
    healthcheck:
      test: [CMD, python, -m, flowforge.process, worker, --health]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:${WEB_PORT:-5173}:5173']
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173/health/ready').then(async r => { if (!r.ok || (await r.json()).status !== 'ready') process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
  rabbitmq-data:
